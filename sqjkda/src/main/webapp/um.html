<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 社区档案管理平台</title>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #2c7a7b;
      --secondary-color: #718096;
      --success-color: #38a169;
      --info-color: #319795;
      --warning-color: #d69e2e;
      --danger-color: #e53e3e;
    }

    body {
      background: linear-gradient(135deg, #f8f9fc 0%, #e6f2f2 100%);
      min-height: 100vh;
    }

    .navbar {
      background: var(--primary-color);
      box-shadow: 0 4px 25px rgba(0,0,0,0.1);
    }

    .navbar-brand {
      color: #ffffff !important;
      font-weight: 700;
    }

    .content-container {
      padding: 2rem;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(44, 122, 123, 0.1);
      margin-top: 2rem;
      border: 1px solid rgba(44, 122, 123, 0.1);
    }

    .user-info {
      padding: 0.85rem 1.75rem;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      margin-right: 1.25rem;
      font-weight: 600;
      color: var(--primary-color);
      box-shadow: 0 4px 15px rgba(44, 122, 123, 0.1);
    }

    .btn-primary {
      background: var(--primary-color);
      border: none;
      color: white;
      box-shadow: 0 5px 15px rgba(44, 122, 123, 0.3);
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(44, 122, 123, 0.4);
      background: var(--info-color);
    }

    .btn-outline-primary {
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .btn-outline-primary:hover {
      background: var(--primary-color);
      border-color: transparent;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(44, 122, 123, 0.4);
      color: white;
    }

    .btn-success {
      background: var(--success-color);
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .btn-success:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(56, 161, 105, 0.4);
    }

    .table {
      border-radius: 10px;
      overflow: hidden;
    }

    .table thead th {
      background: rgba(44, 122, 123, 0.05);
      color: var(--primary-color);
      font-weight: 600;
      border-bottom: 2px solid rgba(44, 122, 123, 0.1);
    }

    .alert-info {
      background: rgba(44, 122, 123, 0.1);
      border: 1px solid rgba(44, 122, 123, 0.2);
      color: var(--primary-color);
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.2rem rgba(44, 122, 123, 0.25);
    }

    .btn-outline-light {
      color: #fff;
      border-color: #fff;
    }

    .btn-outline-light:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .form-label {
      color: var(--primary-color);
      font-weight: 600;
    }

    select.form-control {
      cursor: pointer;
    }

    .btn-sm {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
    }

    .btn-info {
      background: var(--info-color);
      border: none;
      color: white;
    }

    .btn-info:hover {
      background: var(--primary-color);
      color: white;
    }

    .btn-danger {
      background: var(--danger-color);
      border: none;
    }

    .btn-danger:hover {
      background: #c53030;
    }
  </style>
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-building me-2"></i>社区档案管理平台
    </a>
    <div class="d-flex align-items-center">
      <div class="user-info" id="userInfo">
        未登录
      </div>
      <button class="btn btn-outline-light" onclick="logout()">
        <i class="bi bi-box-arrow-right me-2"></i>退出登录
      </button>
    </div>
  </div>
</nav>

<!-- 主要内容 -->
<div class="container">
  <div class="content-container">
    <h2 class="mb-4">用户管理</h2>
    <div class="alert alert-info">
      此模块用于管理系统用户权限，维护用户信息。
    </div>
    <!-- 用户管理功能区块开始 -->
    <div class="mb-3">
      <button class="btn btn-success" onclick="showAddUserForm()">新增用户</button>
    </div>
    <!-- 查询条件输入区 -->
    <form class="row g-2 mb-3" id="searchForm" onsubmit="searchUsers(event)">
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchUserId" placeholder="用户ID">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchUsername" placeholder="用户名">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchPhone" placeholder="手机号">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchCreatedAt" placeholder="注册时间(YYYY-MM-DD)">
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">查询</button>
      </div>
      <div class="col-md-2">
        <button type="button" class="btn btn-secondary w-100" onclick="resetSearch()">重置</button>
      </div>
    </form>
    <table class="table table-bordered" id="usersTable">
      <thead>
      <tr>
        <th>ID</th>
        <th>用户名</th>
        <th>密码</th>
        <th>邮箱</th>
        <th>手机</th>
        <th>用户类型</th>
        <th>操作</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
    <!-- 内嵌编辑/新增表单，仿照健康记录页面 -->
    <div id="userForm" style="display:none;max-width:500px;margin-top:30px;">
      <h5 id="formTitle">新增用户</h5>
      <form onsubmit="submitForm(event)">
        <input type="hidden" id="userId">
        <div class="mb-2">
          <label>用户名:</label>
          <input type="text" class="form-control" id="username" required>
        </div>
        <div class="mb-2">
          <label>密码:</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <div class="mb-2">
          <label>邮箱:</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-2">
          <label>手机:</label>
          <input type="text" class="form-control" id="phone" required>
        </div>
        <div class="mb-2">
          <label>用户类型:</label>
          <select class="form-control" id="userType">
            <option value="1">普通用户</option>
            <option value="2">Root</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <button type="button" class="btn btn-secondary" onclick="hideForm()">取消</button>
      </form>
    </div>
    <!-- 用户管理功能区块结束 -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // 页面加载时检查登录状态
  window.onload = function() {
    setPermission();
    $.ajax({
      url: '',
      success: function() {
        var userInfoStr = localStorage.getItem('userInfo');
        if (userInfoStr) {
          try {
            var user = JSON.parse(userInfoStr);
            document.getElementById('userInfo').textContent = `欢迎，${user.username}`;
          } catch (e) {
            localStorage.removeItem('userInfo');
            document.getElementById('userInfo').textContent = '未登录';
          }
        } else {
          document.getElementById('userInfo').textContent = '未登录';
        }
      }
    });
  };

  // 退出登录
  function logout() {
    localStorage.removeItem('userInfo');
    window.location.href = 'login.html';
  }

  // 用户管理功能JS
  const apiBase = '/spbYq/users';

  function fetchUsers(params = {}) {
    // 构建查询参数
    let url = apiBase + '/queryByPage?page=1&size=20';
    const searchParams = new URLSearchParams();
    for (const key in params) {
      if (params[key]) searchParams.append(key, params[key]);
    }
    if (searchParams.toString()) {
      url += '&' + searchParams.toString();
    }
    fetch(url)
            .then(res => res.json())
            .then(data => {
              let list = [];
              if (Array.isArray(data.data)) {
                list = data.data;
              } else if (data.data && Array.isArray(data.data.content)) {
                list = data.data.content;
              } else if (Array.isArray(data.content)) {
                list = data.content;
              } else if (data.content && Array.isArray(data.content.content)) {
                list = data.content.content;
              } else if (Array.isArray(data)) {
                list = data;
              }
              const tbody = document.querySelector('#usersTable tbody');
              tbody.innerHTML = '';
              list.forEach(r => {
                tbody.innerHTML += `
            <tr>
              <td>${r.userId}</td>
              <td>${r.username}</td>
              <td>${r.passwordHash}</td>
              <td>${r.email || ''}</td>
              <td>${r.phoneNumber || ''}</td>
              <td>${r.userType == 2 ? 'Root' : '普通用户'}</td>
              <td>
                <button class='btn btn-sm btn-info' onclick="editUser(${r.userId})">编辑</button>
                <button class='btn btn-sm btn-danger' onclick="deleteUser(${r.userId})">删除</button>
              </td>
            </tr>
          `;
              });
            });
  }

  function showAddUserForm() {
    document.getElementById('formTitle').innerText = '新增用户';
    document.getElementById('userForm').style.display = '';
    document.getElementById('userId').value = '';
    document.getElementById('username').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('password').value = '';
    document.getElementById('email').value = '';
    document.getElementById('userType').value = '1';
  }

  function hideForm() {
    document.getElementById('userForm').style.display = 'none';
  }

  function submitForm(e) {
    e.preventDefault();
    const user = {
      userId: document.getElementById('userId').value,
      username: document.getElementById('username').value,
      phoneNumber: document.getElementById('phone').value,
      passwordHash: document.getElementById('password').value,
      userType: document.getElementById('userType').value
    };
    const url = user.userId ? apiBase + '/edit' : apiBase + '/add';
    const formData = new URLSearchParams();
    for (const key in user) {
      if (user[key] !== undefined && user[key] !== null && user[key] !== '') {
        formData.append(key, user[key]);
      }
    }
    console.log('提交的数据:', Object.fromEntries(formData));
    console.log('请求URL:', url);
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData.toString()
    })
            .then(res => {
              console.log('响应状态:', res.status);
              return res.json();
            })
            .then(data => {
              console.log('响应数据:', data);
              if (data.code === 1) {
                alert('操作成功');
                hideForm();
                fetchUsers();
              } else {
                alert('操作失败: ' + (data.msg || '未知错误'));
              }
            })
            .catch(err => {
              console.error('请求错误:', err);
              alert('请求失败: ' + err.message);
            });
  }

  function editUser(id) {
    fetch(apiBase + '/queryById/' + id)
      .then(res => res.json())
      .then(data => {
        const r = data.data || data.content;
        // 先清空表单
        document.getElementById('userId').value = '';
        document.getElementById('username').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('password').value = '';
        document.getElementById('email').value = '';
        document.getElementById('userType').value = '1';
        if (data.code === 1 && r) {
          document.getElementById('formTitle').innerText = '编辑用户';
          document.getElementById('userForm').style.display = '';
          if (document.getElementById('userId')) document.getElementById('userId').value = r.userId || r.user_id || '';
          if (document.getElementById('username')) document.getElementById('username').value = r.username || '';
          if (document.getElementById('phone')) document.getElementById('phone').value = r.phoneNumber || r.phone_number || '';
          if (document.getElementById('password')) document.getElementById('password').value = r.passwordHash || r.password_hash || '';
          if (document.getElementById('email')) document.getElementById('email').value = r.email || '';
          if (document.getElementById('userType')) document.getElementById('userType').value = r.userType || 1;
        } else {
          alert(data.msg || '获取数据失败');
        }
      })
      .catch(err => {
        alert('请求失败: ' + err);
      });
  }

  function deleteUser(id) {
    if (!confirm('确定要删除该用户吗？')) return;
    fetch(apiBase + '/deleteById/' + id, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
              if (data.code === 1) {
                alert('删除成功');
                fetchUsers();
              } else {
                alert('删除失败');
              }
            });
  }

  // 查询按钮事件
  function searchUsers(e) {
    if (e) e.preventDefault();
    const params = {
      userId: document.getElementById('searchUserId').value.trim(),
      username: document.getElementById('searchUsername').value.trim(),
      phoneNumber: document.getElementById('searchPhone').value.trim(),
      createdAt: document.getElementById('searchCreatedAt').value.trim()
    };
    fetchUsers(params);
  }

  // 重置查询
  function resetSearch() {
    document.getElementById('searchUserId').value = '';
    document.getElementById('searchUsername').value = '';
    document.getElementById('searchPhone').value = '';
    document.getElementById('searchCreatedAt').value = '';
    fetchUsers();
  }

  // 权限控制：普通用户只能查看
  function setPermission() {
    var userInfoStr = localStorage.getItem('userInfo');
    if (!userInfoStr) return;
    var user = JSON.parse(userInfoStr);
    if (user.userType == 1) {
      // 只禁用用户ID输入框
      var userIdInput = document.getElementById('searchUserId');
      if (userIdInput) userIdInput.disabled = true;
      // 允许其他输入和查询按钮可用
      document.querySelectorAll('input,select,textarea,button[type=submit]').forEach(function(el) {
        if (el.id !== 'searchUserId') el.disabled = false;
      });
      // 只隐藏增删改按钮
      document.querySelectorAll('.btn-info,.btn-danger,.btn-success').forEach(function(btn) { btn.style.display = 'none'; });
    }
  }
</script>
</body>
</html>
