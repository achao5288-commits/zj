<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>档案安全 - 社区档案管理平台</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c7a7b;
            --secondary-color: #718096;
            --success-color: #38a169;
            --info-color: #319795;
            --warning-color: #d69e2e;
            --danger-color: #e53e3e;
        }

        body {
            background: linear-gradient(135deg, #f8f9fc 0%, #e6f2f2 100%);
            min-height: 100vh;
        }

        .navbar {
            background: var(--primary-color);
            box-shadow: 0 4px 25px rgba(0,0,0,0.1);
        }

        .navbar-brand {
            color: #ffffff !important;
            font-weight: 700;
        }

        .content-container {
            padding: 2rem;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(44, 122, 123, 0.1);
            margin-top: 2rem;
            border: 1px solid rgba(44, 122, 123, 0.1);
        }

        .user-info {
            padding: 0.85rem 1.75rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            margin-right: 1.25rem;
            font-weight: 600;
            color: var(--primary-color);
            box-shadow: 0 4px 15px rgba(44, 122, 123, 0.1);
        }

        .btn-primary {
            background: var(--primary-color);
            border: none;
            color: white;
            box-shadow: 0 5px 15px rgba(44, 122, 123, 0.3);
            padding: 0.85rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.4s ease;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(44, 122, 123, 0.4);
            background: var(--info-color);
        }

        .btn-outline-primary {
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0.85rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.4s ease;
        }

        .btn-outline-primary:hover {
            background: var(--primary-color);
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(44, 122, 123, 0.4);
            color: white;
        }

        .btn-success {
            background: var(--success-color);
            border: none;
            padding: 0.85rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.4s ease;
        }

        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(56, 161, 105, 0.4);
        }

        .table {
            border-radius: 10px;
            overflow: hidden;
        }

        .table thead th {
            background: rgba(44, 122, 123, 0.05);
            color: var(--primary-color);
            font-weight: 600;
            border-bottom: 2px solid rgba(44, 122, 123, 0.1);
        }

        .alert-info {
            background: rgba(44, 122, 123, 0.1);
            border: 1px solid rgba(44, 122, 123, 0.2);
            color: var(--primary-color);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(44, 122, 123, 0.25);
        }

        .btn-outline-light {
            color: #fff;
            border-color: #fff;
        }

        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .form-label {
            color: var(--primary-color);
            font-weight: 600;
        }

        select.form-control {
            cursor: pointer;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .btn-info {
            background: var(--info-color);
            border: none;
            color: white;
        }

        .btn-info:hover {
            background: var(--primary-color);
            color: white;
        }

        .btn-danger {
            background: var(--danger-color);
            border: none;
        }

        .btn-danger:hover {
            background: #c53030;
        }
    </style>
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <i class="bi bi-building me-2"></i>社区档案管理平台
        </a>
        <div class="d-flex align-items-center">
            <div class="user-info" id="userInfo">
                未登录
            </div>
            <button class="btn btn-outline-light" onclick="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>退出登录
            </button>
        </div>
    </div>
</nav>

<!-- 主要内容 -->
<div class="container">
    <div class="content-container">
        <h2 class="mb-4">档案安全</h2>
        <div class="alert alert-info">
            此模块用于管理档案访问权限，确保信息安全。
        </div>
        <!-- 隐私档案功能区块开始 -->
        <div class="mb-3">
            <button class="btn btn-success" onclick="showAddPrivacyForm()">新增隐私档案</button>
        </div>
        <!-- 查询条件输入区 -->
        <form class="row g-2 mb-3" id="searchForm" onsubmit="searchPrivacies(event)">
            <div class="col-md-1">
                <input type="text" class="form-control" id="searchId" placeholder="ID">
            </div>
            <div class="col-md-2">
                <input type="text" class="form-control" id="searchUserId" placeholder="用户ID">
            </div>
            <div class="col-md-2">
                <input type="text" class="form-control" id="searchProfileVisibility" placeholder="档案可见性">
            </div>
            <div class="col-md-2">
                <select class="form-control" id="searchHealthDataVisible">
                    <option value="">健康数据可见</option>
                    <option value="1">是</option>
                    <option value="0">否</option>
                </select>
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-primary w-100">查询</button>
            </div>
            <div class="col-md-1">
                <button type="button" class="btn btn-secondary w-100" onclick="resetSearch()">重置</button>
            </div>
        </form>
        <table class="table table-bordered" id="profilesTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>用户ID</th>
                <th>档案可见性</th>
                <th>健康数据可见</th>
                <th>联系方式可见</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
        <!-- 内嵌编辑/新增表单，仿照健康记录页面 -->
        <div id="profileForm" style="display:none;max-width:500px;margin-top:30px;">
            <h5 id="formTitle">新增隐私档案</h5>
            <form onsubmit="submitForm(event)">
                <input type="hidden" id="profileId">
                <div class="mb-2">
                    <label>用户ID:</label>
                    <select class="form-control" id="userId" required>
                        <option value="">请选择用户</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label>档案可见性:</label>
                    <select class="form-control" id="profileVisibility" required>
                        <option value="">请选择</option>
                        <option value="public">公开</option>
                        <option value="private">私密</option>
                        <option value="friends">仅好友</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label>健康数据可见:</label>
                    <select class="form-control" id="healthDataVisible">
                        <option value="1">是</option>
                        <option value="0">否</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label>联系方式可见:</label>
                    <select class="form-control" id="contactInfoVisible">
                        <option value="1">是</option>
                        <option value="0">否</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label>允许被搜索:</label>
                    <select class="form-control" id="searchIndexed">
                        <option value="1">是</option>
                        <option value="0">否</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label>双因素认证:</label>
                    <select class="form-control" id="twoFactorAuth">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">保存</button>
                <button type="button" class="btn btn-secondary" onclick="hideForm()">取消</button>
            </form>
        </div>
        <!-- 隐私档案功能区块结束 -->
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 页面加载时检查登录状态
    function setPermission() {
        var userInfoStr = localStorage.getItem('userInfo');
        if (!userInfoStr) return;
        var user = JSON.parse(userInfoStr);
        if (user.userType == 1) {
            // 只禁用用户ID输入框
            var userIdInput = document.getElementById('searchUserId');
            if (userIdInput) userIdInput.disabled = true;
            // 允许其他输入和查询按钮可用
            document.querySelectorAll('input,select,textarea,button[type=submit]').forEach(function(el) {
                if (el.id !== 'searchUserId') el.disabled = false;
            });
            // 只隐藏增删改按钮
            document.querySelectorAll('.btn-info,.btn-danger,.btn-success').forEach(function(btn) { btn.style.display = 'none'; });
        }
    }

    window.onload = function() {
        setPermission();
        $.ajax({
            url: '',
            success: function() {
                var userInfoStr = localStorage.getItem('userInfo');
                if (userInfoStr) {
                    try {
                        var user = JSON.parse(userInfoStr);
                        document.getElementById('userInfo').textContent = `欢迎，${user.username}`;
                    } catch (e) {
                        localStorage.removeItem('userInfo');
                        document.getElementById('userInfo').textContent = '未登录';
                    }
                } else {
                    document.getElementById('userInfo').textContent = '未登录';
                }
            }
        });
    };

    // 退出登录
    function logout() {
        localStorage.removeItem('userInfo');
        window.location.href = 'login.html';
    }

    // 隐私档案功能JS
    const apiBase = '/spbYq/userPrivacyProfiles';

    function fetchPrivacies(params = {}) {
        let url = apiBase + '/queryByPage?page=1&size=20';
        const searchParams = new URLSearchParams();
        for (const key in params) {
            if (params[key]) searchParams.append(key, params[key]);
        }
        if (searchParams.toString()) {
            url += '&' + searchParams.toString();
        }
        fetch(url)
            .then(res => res.json())
            .then(data => {
                let list = [];
                if (Array.isArray(data.data)) {
                    list = data.data;
                } else if (data.data && Array.isArray(data.data.content)) {
                    list = data.data.content;
                } else if (Array.isArray(data.content)) {
                    list = data.content;
                } else if (data.content && Array.isArray(data.content.content)) {
                    list = data.content.content;
                } else if (Array.isArray(data)) {
                    list = data;
                }
                const tbody = document.querySelector('#profilesTable tbody');
                tbody.innerHTML = '';
                list.forEach(r => {
                    tbody.innerHTML += `
                    <tr>
                        <td>${r.id}</td>
                        <td>${r.userId}</td>
                        <td>${r.profileVisibility || ''}</td>
                        <td>${r.healthDataVisible == 1 ? '是' : '否'}</td>
                        <td>${r.contactInfoVisible == 1 ? '是' : '否'}</td>
                        <td>
                            <button class='btn btn-sm btn-info' onclick="editPrivacy(${r.id})">编辑</button>
                            <button class='btn btn-sm btn-danger' onclick="deletePrivacy(${r.id})">删除</button>
                        </td>
                    </tr>
                    `;
                });
            });
    }

    function loadUserList(selectedId) {
        fetch('/spbYq/users/queryByPage?page=1&size=1000')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('userId');
                select.innerHTML = '<option value="">请选择用户</option>';
                let list = [];
                if (Array.isArray(data.data)) {
                    list = data.data;
                } else if (data.data && Array.isArray(data.data.content)) {
                    list = data.data.content;
                } else if (Array.isArray(data.content)) {
                    list = data.content;
                } else if (data.content && Array.isArray(data.content.content)) {
                    list = data.content.content;
                }
                list.forEach(u => {
                    const id = u.userId || u.id;
                    const name = u.username || u.name || '';
                    select.innerHTML += `<option value="${id}" ${selectedId == id ? 'selected' : ''}>${id} - ${name}</option>`;
                });
            });
    }

    function showAddPrivacyForm() {
        document.getElementById('formTitle').innerText = '新增隐私档案';
        document.getElementById('profileForm').style.display = '';
        document.getElementById('profileId').value = '';
        loadUserList();
        document.getElementById('profileVisibility').value = '';
        document.getElementById('healthDataVisible').value = '1';
        document.getElementById('contactInfoVisible').value = '1';
        document.getElementById('searchIndexed').value = '1';
        document.getElementById('twoFactorAuth').value = '0';
    }

    function hideForm() {
        document.getElementById('profileForm').style.display = 'none';
    }

    function submitForm(e) {
        e.preventDefault();
        const privacy = {
            id: document.getElementById('profileId').value,
            userId: document.getElementById('userId').value,
            profileVisibility: document.getElementById('profileVisibility').value,
            healthDataVisible: document.getElementById('healthDataVisible').value,
            contactInfoVisible: document.getElementById('contactInfoVisible').value,
            searchIndexed: document.getElementById('searchIndexed').value,
            twoFactorAuth: document.getElementById('twoFactorAuth').value
        };
        if (!privacy.userId) {
            alert('用户ID不能为空，请重新登录或联系管理员');
            return;
        }
        const url = privacy.id ? apiBase + '/edit' : apiBase + '/add';
        const formData = new URLSearchParams();
        for (const key in privacy) {
            if (privacy[key] !== undefined && privacy[key] !== null) {
                formData.append(key, privacy[key]);
            }
        }
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
        })
            .then(res => res.json())
            .then(data => {
                if (data.code === 1) {
                    alert('操作成功');
                    hideForm();
                    fetchPrivacies();
                } else {
                    alert('操作失败: ' + (data.msg || '未知错误'));
                }
            })
            .catch(err => {
                alert('请求失败: ' + err);
            });
    }

    function editPrivacy(id) {
        fetch(apiBase + '/queryById/' + id)
            .then(res => {
                if (!res.ok) {
                    throw new Error('HTTP error ' + res.status);
                }
                return res.json();
            })
            .then(data => {
                // 先清空表单
                document.getElementById('profileId').value = '';
                document.getElementById('userId').value = '';
                document.getElementById('profileVisibility').value = '';
                document.getElementById('healthDataVisible').value = '1';
                document.getElementById('contactInfoVisible').value = '1';
                document.getElementById('searchIndexed').value = '1';
                document.getElementById('twoFactorAuth').value = '0';
                
                const r = data.data || data.content;
                if (data.code === 1 && r) {
                    document.getElementById('formTitle').innerText = '编辑隐私档案';
                    document.getElementById('profileForm').style.display = '';
                    document.getElementById('profileId').value = r.id || '';
                    loadUserList(r.userId || '');
                    if (r.profileVisibility) document.getElementById('profileVisibility').value = r.profileVisibility;
                    if (r.healthDataVisible !== undefined) document.getElementById('healthDataVisible').value = r.healthDataVisible;
                    if (r.contactInfoVisible !== undefined) document.getElementById('contactInfoVisible').value = r.contactInfoVisible;
                    if (r.searchIndexed !== undefined) document.getElementById('searchIndexed').value = r.searchIndexed;
                    if (r.twoFactorAuth !== undefined) document.getElementById('twoFactorAuth').value = r.twoFactorAuth;
                } else {
                    alert(data.msg || '获取数据失败');
                }
            })
            .catch(err => {
                alert('请求失败: ' + err);
            });
    }

    function deletePrivacy(id) {
        if (!confirm('确定要删除该隐私档案吗？')) return;
        fetch(apiBase + '/deleteById/' + id, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.code === 1) {
                    alert('删除成功');
                    fetchPrivacies();
                } else {
                    alert('删除失败');
                }
            });
    }

    // 查询按钮事件
    function searchPrivacies(e) {
        if (e) e.preventDefault();
        const params = {
            id: document.getElementById('searchId').value.trim(),
            userId: document.getElementById('searchUserId').value.trim(),
            profileVisibility: document.getElementById('searchProfileVisibility').value.trim(),
            healthDataVisible: document.getElementById('searchHealthDataVisible').value.trim()
        };
        fetchPrivacies(params);
    }

    // 重置查询
    function resetSearch() {
        document.getElementById('searchId').value = '';
        document.getElementById('searchUserId').value = '';
        document.getElementById('searchProfileVisibility').value = '';
        document.getElementById('searchHealthDataVisible').value = '';
        fetchPrivacies();
    }

    // 页面加载时自动拉取隐私档案
    fetchPrivacies();
</script>
</body>
</html>
