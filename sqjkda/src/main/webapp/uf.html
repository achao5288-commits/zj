<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户反馈 - 社区档案管理平台</title>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #2c7a7b;
      --secondary-color: #718096;
      --success-color: #38a169;
      --info-color: #319795;
      --warning-color: #d69e2e;
      --danger-color: #e53e3e;
    }

    body {
      background: linear-gradient(135deg, #f8f9fc 0%, #e6f2f2 100%);
      min-height: 100vh;
    }

    .navbar {
      background: var(--primary-color);
      box-shadow: 0 4px 25px rgba(0,0,0,0.1);
    }

    .navbar-brand {
      color: #ffffff !important;
      font-weight: 700;
    }

    .content-container {
      padding: 2rem;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(44, 122, 123, 0.1);
      margin-top: 2rem;
      border: 1px solid rgba(44, 122, 123, 0.1);
    }

    .user-info {
      padding: 0.85rem 1.75rem;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      margin-right: 1.25rem;
      font-weight: 600;
      color: var(--primary-color);
      box-shadow: 0 4px 15px rgba(44, 122, 123, 0.1);
    }

    .btn-primary {
      background: var(--primary-color);
      border: none;
      color: white;
      box-shadow: 0 5px 15px rgba(44, 122, 123, 0.3);
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(44, 122, 123, 0.4);
      background: var(--info-color);
    }

    .btn-outline-primary {
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .btn-outline-primary:hover {
      background: var(--primary-color);
      border-color: transparent;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(44, 122, 123, 0.4);
      color: white;
    }

    .btn-success {
      background: var(--success-color);
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .btn-success:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(56, 161, 105, 0.4);
    }

    .table {
      border-radius: 10px;
      overflow: hidden;
    }

    .table thead th {
      background: rgba(44, 122, 123, 0.05);
      color: var(--primary-color);
      font-weight: 600;
      border-bottom: 2px solid rgba(44, 122, 123, 0.1);
    }

    .alert-info {
      background: rgba(44, 122, 123, 0.1);
      border: 1px solid rgba(44, 122, 123, 0.2);
      color: var(--primary-color);
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.2rem rgba(44, 122, 123, 0.25);
    }

    .btn-outline-light {
      color: #fff;
      border-color: #fff;
    }

    .btn-outline-light:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .form-label {
      color: var(--primary-color);
      font-weight: 600;
    }

    select.form-control {
      cursor: pointer;
    }

    .btn-sm {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
    }

    .btn-info {
      background: var(--info-color);
      border: none;
      color: white;
    }

    .btn-info:hover {
      background: var(--primary-color);
      color: white;
    }

    .btn-danger {
      background: var(--danger-color);
      border: none;
    }

    .btn-danger:hover {
      background: #c53030;
    }
  </style>
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-building me-2"></i>社区档案管理平台
    </a>
    <div class="d-flex align-items-center">
      <div class="user-info" id="userInfo">
        未登录
      </div>
      <button class="btn btn-outline-light" onclick="logout()">
        <i class="bi bi-box-arrow-right me-2"></i>退出登录
      </button>
    </div>
  </div>
</nav>

<!-- 主要内容 -->
<div class="container">
  <div class="content-container">
    <h2 class="mb-4">用户反馈</h2>
    <div class="alert alert-info">
      此模块用于收集用户意见和建议，持续改进服务质量。
    </div>
    <!-- 用户反馈功能区块开始 -->
    <div class="mb-3">
      <button class="btn btn-success" onclick="showAddFeedbackForm()">新增反馈</button>
    </div>
    <!-- 查询条件输入区 -->
    <form class="row g-2 mb-3" id="searchForm" onsubmit="searchFeedbacks(event)">
      <div class="col-md-1">
        <input type="text" class="form-control" id="searchFeedbackId" placeholder="反馈ID">
      </div>
      <div class="col-md-1">
        <input type="text" class="form-control" id="searchUserId" placeholder="用户ID">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchFeedbackType" placeholder="反馈类型">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchTitle" placeholder="标题">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchContent" placeholder="内容">
      </div>
      <div class="col-md-1">
        <input type="text" class="form-control" id="searchStatus" placeholder="状态">
      </div>
      <div class="col-md-1">
        <input type="text" class="form-control" id="searchAdminNotes" placeholder="管理员备注">
      </div>
      <div class="col-md-1">
        <input type="text" class="form-control" id="searchResponse" placeholder="回复">
      </div>
      <div class="col-md-1">
        <button type="submit" class="btn btn-primary w-100">查询</button>
      </div>
      <div class="col-md-1">
        <button type="button" class="btn btn-secondary w-100" onclick="resetSearch()">重置</button>
      </div>
    </form>
    <table class="table table-bordered" id="feedbacksTable">
      <thead>
      <tr>
        <th>ID</th>
        <th>用户ID</th>
        <th>反馈类型</th>
        <th>标题</th>
        <th>内容</th>
        <th>状态</th>
        <th>管理员备注</th>
        <th>回复</th>
        <th>操作</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
    <!-- 内嵌编辑/新增表单，仿照健康记录页面 -->
    <div id="feedbackForm" style="display:none;max-width:500px;margin-top:30px;">
      <h5 id="formTitle">新增反馈</h5>
      <form onsubmit="submitForm(event)">
        <input type="hidden" id="feedbackId">
        <div class="mb-2">
          <label>用户ID:</label>
          <input type="number" class="form-control" id="userId" required>
        </div>
        <div class="mb-2">
          <label>反馈类型:</label>
          <select class="form-control" id="feedbackType" required>
            <option value="">请选择反馈类型</option>
            <option value="suggestion">建议</option>
            <option value="complaint">投诉</option>
            <option value="general">咨询</option>
          </select>
        </div>
        <div class="mb-2">
          <label>标题:</label>
          <input type="text" class="form-control" id="title" required>
        </div>
        <div class="mb-2">
          <label>内容:</label>
          <input type="text" class="form-control" id="content" required>
        </div>
        <div class="mb-2">
          <label>状态:</label>
          <select class="form-control" id="status" required>
            <option value="">请选择状态</option>
            <option value="pending">待处理</option>
            <option value="acknowledged">处理中</option>
            <option value="resolved">已完成</option>
          </select>
        </div>
        <div class="mb-2">
          <label>管理员备注:</label>
          <input type="text" class="form-control" id="adminNotes">
        </div>
        <div class="mb-2">
          <label>回复:</label>
          <input type="text" class="form-control" id="response">
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <button type="button" class="btn btn-secondary" onclick="hideForm()">取消</button>
      </form>
    </div>
    <!-- 用户反馈功能区块结束 -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // 通用数据提取函数
  function extractList(data) {
    if (Array.isArray(data.data)) return data.data;
    if (data.data && Array.isArray(data.data.content)) return data.data.content;
    if (Array.isArray(data.content)) return data.content;
    if (data.content && Array.isArray(data.content.content)) return data.content.content;
    if (Array.isArray(data)) return data;
    return [];
  }

  // 权限控制，查询按钮始终可用
  function setButtonPermission() {
    const userInfoStr = localStorage.getItem('userInfo');
    if (!userInfoStr) return;
    const user = JSON.parse(userInfoStr);
    if (user.userType == 1) {
      // 只禁用用户ID输入框
      const userIdInput = document.getElementById('searchUserId');
      if (userIdInput) userIdInput.disabled = true;
      // 允许其他输入和查询按钮可用
      document.querySelectorAll('input,select,textarea,button[type=submit]').forEach(el => {
        if (el.id !== 'searchUserId') el.disabled = false;
      });
      // 只隐藏增删改按钮
      document.querySelectorAll('.btn-info,.btn-danger,.btn-success').forEach(btn => btn.style.display = 'none');
    }
  }

  window.onload = function() {
    setButtonPermission();
    fetchFeedbacks();
    // 查询按钮事件绑定
    const searchBtn = document.querySelector('form#searchForm button[type=submit]');
    if (searchBtn) {
      searchBtn.addEventListener('click', searchFeedbacks);
    }
  };

  // 用户反馈功能JS
  const apiBase = '/spbYq/userFeedback';

  function fetchFeedbacks(params = {}) {
    let url = apiBase + '/queryByPage?page=1&size=20';
    const searchParams = new URLSearchParams();
    for (const key in params) {
      if (params[key]) searchParams.append(key, params[key]);
    }
    if (searchParams.toString()) {
      url += '&' + searchParams.toString();
    }
    fetch(url)
            .then(res => res.json())
            .then(data => {
              const list = extractList(data);
              const tbody = document.querySelector('#feedbacksTable tbody');
              tbody.innerHTML = '';
              if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center">暂无数据</td></tr>';
                return;
              }
              list.forEach(r => {
                tbody.innerHTML += `
            <tr>
              <td>${r.feedbackId}</td>
              <td>${r.userId}</td>
              <td>${r.feedbackType}</td>
              <td>${r.title || ''}</td>
              <td>${r.content}</td>
              <td>${r.status || ''}</td>
              <td>${r.adminNotes || ''}</td>
              <td>${r.response || ''}</td>
              <td>
                <button class='btn btn-sm btn-info' onclick="editFeedback(${r.feedbackId})">编辑</button>
                <button class='btn btn-sm btn-danger' onclick="deleteFeedback(${r.feedbackId})">删除</button>
              </td>
            </tr>
          `;
              });
            });
  }

  function showAddFeedbackForm() {
    document.getElementById('formTitle').innerText = '新增反馈';
    document.getElementById('feedbackForm').style.display = '';
    document.getElementById('feedbackId').value = '';
    document.getElementById('feedbackType').value = '';
    document.getElementById('title').value = '';
    document.getElementById('content').value = '';
    document.getElementById('status').value = 'pending';
    document.getElementById('adminNotes').value = '';
    document.getElementById('response').value = '';
    
    // 自动填充当前登录用户的ID
    const userInfoStr = localStorage.getItem('userInfo');
    if (userInfoStr) {
      const user = JSON.parse(userInfoStr);
      document.getElementById('userId').value = user.userId || user.id || '';
    } else {
      document.getElementById('userId').value = '';
    }
  }

  function hideForm() {
    document.getElementById('feedbackForm').style.display = 'none';
  }

  function submitForm(e) {
    e.preventDefault();
    const feedback = {
      feedbackId: document.getElementById('feedbackId').value,
      userId: document.getElementById('userId').value,
      feedbackType: document.getElementById('feedbackType').value,
      title: document.getElementById('title').value,
      content: document.getElementById('content').value,
      status: document.getElementById('status').value,
      adminNotes: document.getElementById('adminNotes').value,
      response: document.getElementById('response').value
    };
    
    // 验证必填字段
    if (!feedback.userId) {
      alert('用户ID不能为空');
      return;
    }
    if (!feedback.feedbackType) {
      alert('请选择反馈类型');
      return;
    }
    if (!feedback.title) {
      alert('标题不能为空');
      return;
    }
    if (!feedback.content) {
      alert('内容不能为空');
      return;
    }
    
    const url = feedback.feedbackId ? apiBase + '/edit' : apiBase + '/add';
    const formData = new URLSearchParams();
    for (const key in feedback) {
      if (feedback[key] !== undefined && feedback[key] !== null && feedback[key] !== '') {
        formData.append(key, feedback[key]);
      }
    }
    
    console.log('提交数据到:', url);
    console.log('提交内容:', formData.toString());
    
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData.toString()
    })
      .then(res => {
        if (!res.ok) {
          console.error('HTTP 错误:', res.status, res.statusText);
          return res.text().then(text => {
            throw new Error('服务器错误: ' + res.status + ' - ' + text);
          });
        }
        return res.json();
      })
      .then(data => {
        console.log('服务器响应:', data);
        if (data.code === 1) {
          alert('操作成功');
          hideForm();
          fetchFeedbacks();
        } else {
          alert('操作失败: ' + (data.msg || '未知错误'));
        }
      })
      .catch(err => {
        console.error('请求失败:', err);
        alert('请求失败: ' + err.message);
      });
  }

  function editFeedback(id) {
    fetch(apiBase + '/queryById/' + id)
      .then(res => res.json())
      .then(data => {
        // 先清空表单
        document.getElementById('feedbackId').value = '';
        document.getElementById('userId').value = '';
        document.getElementById('feedbackType').value = '';
        document.getElementById('title').value = '';
        document.getElementById('content').value = '';
        document.getElementById('status').value = '';
        document.getElementById('adminNotes').value = '';
        document.getElementById('response').value = '';
        const r = data.data || data.content;
        if (data.code === 1 && r) {
          document.getElementById('formTitle').innerText = '编辑反馈';
          document.getElementById('feedbackForm').style.display = '';
          if (document.getElementById('feedbackId')) document.getElementById('feedbackId').value = r.feedbackId || r.feedback_id || '';
          if (document.getElementById('userId')) document.getElementById('userId').value = r.userId || r.user_id || '';
          if (document.getElementById('feedbackType')) document.getElementById('feedbackType').value = r.feedbackType || r.feedback_type || '';
          if (document.getElementById('title')) document.getElementById('title').value = r.title || '';
          if (document.getElementById('content')) document.getElementById('content').value = r.content || '';
          if (document.getElementById('status')) document.getElementById('status').value = r.status || '';
          if (document.getElementById('adminNotes')) document.getElementById('adminNotes').value = r.adminNotes || r.admin_notes || '';
          if (document.getElementById('response')) document.getElementById('response').value = r.response || '';
        } else {
          alert(data.msg || '获取数据失败');
        }
      })
      .catch(err => {
        alert('请求失败: ' + err);
      });
  }

  function deleteFeedback(id) {
    if (!confirm('确定要删除该反馈吗？')) return;
    fetch(apiBase + '/deleteById/' + id, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
              if (data.code === 1) {
                alert('删除成功');
                fetchFeedbacks();
              } else {
                alert('删除失败');
              }
            });
  }

  // 查询按钮事件
  function searchFeedbacks(e) {
    if (e) e.preventDefault();
    const params = {
      feedbackId: document.getElementById('searchFeedbackId').value.trim(),
      userId: document.getElementById('searchUserId').value.trim(),
      feedbackType: document.getElementById('searchFeedbackType').value.trim(),
      title: document.getElementById('searchTitle').value.trim(),
      content: document.getElementById('searchContent').value.trim(),
      status: document.getElementById('searchStatus').value.trim(),
      adminNotes: document.getElementById('searchAdminNotes').value.trim(),
      response: document.getElementById('searchResponse').value.trim()
    };
    fetchFeedbacks(params);
  }

  // 重置查询
  function resetSearch() {
    document.getElementById('searchFeedbackId').value = '';
    document.getElementById('searchUserId').value = '';
    document.getElementById('searchFeedbackType').value = '';
    document.getElementById('searchTitle').value = '';
    document.getElementById('searchContent').value = '';
    document.getElementById('searchStatus').value = '';
    document.getElementById('searchAdminNotes').value = '';
    document.getElementById('searchResponse').value = '';
    fetchFeedbacks();
  }

  // 退出登录
  function logout() {
    localStorage.removeItem('userInfo');
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
