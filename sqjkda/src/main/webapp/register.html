<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 社区档案管理平台</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c7a7b;
            --secondary-color: #718096;
            --success-color: #38a169;
            --info-color: #319795;
            --warning-color: #d69e2e;
            --danger-color: #e53e3e;
        }

        body {
            background: linear-gradient(135deg, #f8f9fc 0%, #e6f2f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .register-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 40px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(44, 122, 123, 0.1);
            border: 1px solid rgba(44, 122, 123, 0.1);
        }

        .register-title {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary-color);
            font-size: 28px;
            font-weight: 700;
            position: relative;
            padding-bottom: 15px;
        }

        .register-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--primary-color);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(44, 122, 123, 0.2);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(44, 122, 123, 0.25);
        }

        .form-control[readonly] {
            background-color: rgba(44, 122, 123, 0.05);
            border-color: rgba(44, 122, 123, 0.1);
            cursor: not-allowed;
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: var(--success-color);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.4s ease;
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(56, 161, 105, 0.4);
            background: var(--info-color);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: var(--secondary-color);
        }

        .login-link a {
            color: var(--success-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .login-link a:hover {
            color: var(--info-color);
        }

        .alert {
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid transparent;
        }

        .alert-danger {
            background: rgba(229, 62, 62, 0.1);
            border-color: rgba(229, 62, 62, 0.2);
            color: var(--danger-color);
        }

        .invalid-feedback {
            color: var(--danger-color);
            font-size: 0.875rem;
            margin-top: 5px;
        }

        .password-requirements {
            font-size: 0.875rem;
            color: var(--secondary-color);
            margin-top: 8px;
            padding-left: 0;
        }

        .password-requirements ul {
            list-style: none;
            padding-left: 0;
            margin-bottom: 0;
        }

        .password-requirements li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 4px;
        }

        .password-requirements li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--primary-color);
        }

        .platform-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: block;
            text-align: center;
        }

        .text-muted {
            color: var(--secondary-color) !important;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="register-container">
        <i class="bi bi-building platform-icon"></i>
        <h2 class="register-title">用户注册</h2>
        <div class="alert alert-danger" role="alert" id="registerError" style="display: none;"></div>
        <form id="registerForm" onsubmit="return handleRegister(event)">
            <div class="form-group">
                <label for="userId" class="form-label">用户ID</label>
                <input type="text" class="form-control" id="userId" name="userId" readonly>
                <small class="text-muted">系统自动生成的唯一标识</small>
            </div>
            <div class="form-group">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username"
                       minlength="2" maxlength="20" required>
                <div class="invalid-feedback">用户名长度需要在2-20个字符之间</div>
            </div>
            <div class="form-group">
                <label for="phoneNumber" class="form-label">手机号码</label>
                <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber"
                       pattern="^1[3-9]\d{9}$" required>
                <div class="invalid-feedback">请输入有效的手机号码</div>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="passwordHash" required>
                <div class="password-requirements">
                    密码要求：
                    <ul>
                        <li>长度8-16位</li>
                        <li>必须包含大写字母</li>
                        <li>必须包含小写字母</li>
                        <li>必须包含数字</li>
                        <li>必须包含特殊字符</li>
                    </ul>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmPassword" class="form-label">确认密码</label>
                <input type="password" class="form-control" id="confirmPassword" required>
                <div class="invalid-feedback">两次输入的密码不一致</div>
            </div>
            <div class="form-group">
                <label class="form-label">用户类型</label>
                <select class="form-control" id="userType" name="userType" required>
                    <option value="1" selected>普通用户</option>
                    <option value="2">Root用户</option>
                </select>
            </div>
            <button type="submit" class="btn btn-register">
                <i class="bi bi-person-plus me-2"></i>注册
            </button>
        </form>
        <div class="login-link">
            已有账号？<a href="login.html">立即登录</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    // 生成随机用户ID
    function generateUserId() {
        const timestamp = new Date().getTime();
        const random = Math.floor(Math.random() * 1000);
        return `USER${timestamp}${random}`;
    }

    // 页面加载时生成用户ID
    window.onload = function() {
        document.getElementById('userId').value = generateUserId();
    };

    async function handleRegister(event) {
        event.preventDefault();
        const userId = document.getElementById('userId').value;
        const username = document.getElementById('username').value;
        const phoneNumber = document.getElementById('phoneNumber').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const userType = document.getElementById('userType').value;
        const errorAlert = document.getElementById('registerError');

        // 用户名验证
        if (username.length < 2 || username.length > 20) {
            errorAlert.textContent = '用户名长度需要在2-20个字符之间';
            errorAlert.style.display = 'block';
            return;
        }

        // 手机号码格式验证
        if (!phoneNumber.match(/^1[3-9]\d{9}$/)) {
            errorAlert.textContent = '请输入有效的手机号码';
            errorAlert.style.display = 'block';
            return;
        }

        // 密码一致性验证
        if (password !== confirmPassword) {
            errorAlert.textContent = '两次输入的密码不一致';
            errorAlert.style.display = 'block';
            return;
        }

        // 密码强度验证
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\da-zA-Z]).{8,16}$/;
        if (!passwordRegex.test(password)) {
            errorAlert.textContent = '密码必须包含大小写字母、数字和特殊字符，长度8-16位';
            errorAlert.style.display = 'block';
            return;
        }
        $.ajax({
            url:'http://localhost:8081/spbYq/users/add',
            type:'GET',
            data:{
                phoneNumber:phoneNumber,
                passwordHash:password,
                username:username,
                userType:userType,
            },
            success: function (response){
                alert('注册成功');
                window.location.href = 'login.html';
            },
            error:function (xhr,status,error){
                alert('注册失败:'+error);
            }
        })
    }
</script>
</body>
</html>
