<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭医生 - 健康管理系统</title>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #2c7a7b;
      --secondary-color: #718096;
      --success-color: #38a169;
      --info-color: #319795;
      --warning-color: #d69e2e;
      --danger-color: #e53e3e;
    }

    body {
      background: linear-gradient(135deg, #f8f9fc 0%, #e6f2f2 100%);
      min-height: 100vh;
    }

    .navbar {
      background: var(--primary-color);
      box-shadow: 0 4px 25px rgba(0,0,0,0.1);
    }

    .navbar-brand {
      color: #ffffff !important;
      font-weight: 700;
    }

    .content-container {
      padding: 2rem;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(44, 122, 123, 0.1);
      margin-top: 2rem;
      border: 1px solid rgba(44, 122, 123, 0.1);
    }

    .user-info {
      padding: 0.85rem 1.75rem;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      margin-right: 1.25rem;
      font-weight: 600;
      color: var(--primary-color);
      box-shadow: 0 4px 15px rgba(44, 122, 123, 0.1);
    }

    .btn-primary {
      background: var(--primary-color);
      border: none;
      color: white;
      box-shadow: 0 5px 15px rgba(44, 122, 123, 0.3);
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(44, 122, 123, 0.4);
      background: var(--info-color);
    }

    .btn-outline-primary {
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .btn-outline-primary:hover {
      background: var(--primary-color);
      border-color: transparent;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(44, 122, 123, 0.4);
      color: white;
    }

    .btn-success {
      background: var(--success-color);
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .btn-success:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(56, 161, 105, 0.4);
    }

    .table {
      border-radius: 10px;
      overflow: hidden;
    }

    .table thead th {
      background: rgba(44, 122, 123, 0.05);
      color: var(--primary-color);
      font-weight: 600;
      border-bottom: 2px solid rgba(44, 122, 123, 0.1);
    }

    .alert-info {
      background: rgba(44, 122, 123, 0.1);
      border: 1px solid rgba(44, 122, 123, 0.2);
      color: var(--primary-color);
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.2rem rgba(44, 122, 123, 0.25);
    }

    .btn-outline-light {
      color: #fff;
      border-color: #fff;
    }

    .btn-outline-light:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
  </style>
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-building me-2"></i>健康管理系统
    </a>
    <div class="d-flex align-items-center">
      <div class="user-info" id="userInfo">
        未登录
      </div>
      <button class="btn btn-outline-light" onclick="logout()">
        <i class="bi bi-box-arrow-right me-2"></i>退出登录
      </button>
    </div>
  </div>
</nav>

<!-- 主要内容 -->
<div class="container">
  <div class="content-container">
    <h2 class="mb-4">家庭医生</h2>
    <div class="alert alert-info">
      此模块用于查找和联系您的家庭医生。
    </div>
    <!-- 家庭医生功能区块开始 -->
    <div class="mb-3">
      <button class="btn btn-success" onclick="showAddDoctorForm()">新增家庭医生</button>
    </div>
    <!-- 查询条件输入区 -->
    <form class="row g-2 mb-3" id="searchForm" onsubmit="searchDoctors(event)">
      <div class="col-md-1">
        <input type="text" class="form-control" id="searchDoctorId" placeholder="医生ID">
      </div>
      <div class="col-md-1">
        <input type="text" class="form-control" id="searchUserId" placeholder="用户ID">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchSpecialty" placeholder="专业">
      </div>
      <div class="col-md-1">
        <select class="form-control" id="searchIsAvailable">
          <option value="">可用?</option>
          <option value="1">是</option>
          <option value="0">否</option>
        </select>
      </div>
      <div class="col-md-1">
        <input type="text" class="form-control" id="searchAverageRating" placeholder="评分">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchTotalPatients" placeholder="总患者数">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchCompletedAppointments" placeholder="已完成预约">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchLicenseNumber" placeholder="执照号码">
      </div>
      <div class="col-md-1">
        <button type="submit" class="btn btn-primary w-100">查询</button>
      </div>
      <div class="col-md-1">
        <button type="button" class="btn btn-secondary w-100" onclick="resetSearch()">重置</button>
      </div>
    </form>
    <table class="table table-bordered" id="doctorsTable">
      <thead>
      <tr>
        <th>ID</th>
        <th>用户ID</th>
        <th>专业</th>
        <th>是否可用</th>
        <th>平均评分</th>
        <th>总患者数</th>
        <th>已完成预约</th>
        <th>执照号码</th>
        <th>操作</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
    <!-- 内嵌编辑/新增表单，仿照健康记录页面 -->
    <div id="doctorForm" style="display:none;max-width:500px;margin-top:30px;">
      <h5 id="formTitle">新增家庭医生</h5>
      <form onsubmit="submitForm(event)">
        <input type="hidden" id="doctorId">
        <div class="mb-2">
          <label>用户ID:</label>
          <input type="number" class="form-control" id="userId" required>
        </div>
        <div class="mb-2">
          <label>专业:</label>
          <select class="form-control" id="specialty" required>
            <option value="">请选择专业</option>
            <option value="内科">内科</option>
            <option value="外科">外科</option>
            <option value="儿科">儿科</option>
            <option value="妇科">妇科</option>
          </select>
        </div>
        <div class="mb-2">
          <label>是否可用:</label>
          <input type="checkbox" id="isAvailable">
        </div>
        <div class="mb-2">
          <label>平均评分:</label>
          <input type="number" class="form-control" id="averageRating" step="0.1" min="0" max="5">
        </div>
        <div class="mb-2">
          <label>总患者数:</label>
          <input type="number" class="form-control" id="totalPatients" min="0">
        </div>
        <div class="mb-2">
          <label>已完成预约:</label>
          <input type="number" class="form-control" id="completedAppointments" min="0">
        </div>
        <div class="mb-2">
          <label>执照号码:</label>
          <input type="text" class="form-control" id="licenseNumber" required>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <button type="button" class="btn btn-secondary" onclick="hideForm()">取消</button>
      </form>
    </div>
    <!-- 家庭医生功能区块结束 -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function setPermission() {
    var userInfoStr = localStorage.getItem('userInfo');
    if (!userInfoStr) return;
    var user = JSON.parse(userInfoStr);
    if (user.userType == 1) {
      document.querySelectorAll('.btn-info,.btn-danger,.btn-success,.btn-primary').forEach(btn => btn.style.display = 'none');
      document.querySelectorAll('input,select,textarea,button[type=submit]').forEach(el => el.disabled = true);
    }
  }

  window.onload = function() {
    setPermission();
    $.ajax({
      url: '',
      success: function() {
        var userInfoStr = localStorage.getItem('userInfo');
        if (userInfoStr) {
          try {
            var user = JSON.parse(userInfoStr);
            document.getElementById('userInfo').textContent = `欢迎，${user.username}`;
          } catch (e) {
            localStorage.removeItem('userInfo');
            document.getElementById('userInfo').textContent = '未登录';
          }
        } else {
          document.getElementById('userInfo').textContent = '未登录';
        }
      }
    });
  };

  // 退出登录
  function logout() {
    localStorage.removeItem('userInfo');
    window.location.href = 'login.html';
  }

  // 家庭医生功能JS
  const apiBase = '/spbYq/familyDoctors';

  function fetchDoctors(params = {}) {
    let url = apiBase + '/queryByPage?page=1&size=20';
    const searchParams = new URLSearchParams();
    for (const key in params) {
      if (params[key]) searchParams.append(key, params[key]);
    }
    if (searchParams.toString()) {
      url += '&' + searchParams.toString();
    }
    fetch(url)
            .then(res => {
              if (!res.ok) {
                throw new Error('HTTP error! status: ' + res.status);
              }
              return res.json();
            })
            .then(data => {
              console.log('家庭医生查询结果:', data);
              let list = [];
              if (data.code === 1 && data.content && Array.isArray(data.content)) {
                list = data.content;
              } else if (data.code === 1 && data.content && data.content.content && Array.isArray(data.content.content)) {
                list = data.content.content;
              } else if (Array.isArray(data.data)) {
                list = data.data;
              } else if (data.data && Array.isArray(data.data.content)) {
                list = data.data.content;
              } else if (Array.isArray(data.content)) {
                list = data.content;
              } else if (data.content && Array.isArray(data.content.content)) {
                list = data.content.content;
              } else if (Array.isArray(data)) {
                list = data;
              }
              const tbody = document.querySelector('#doctorsTable tbody');
              tbody.innerHTML = '';
              list.forEach(r => {
                tbody.innerHTML += `
            <tr>
              <td>${r.doctorId}</td>
              <td>${r.userId}</td>
              <td>${r.specialty}</td>
              <td>${r.isAvailable ? '是' : '否'}</td>
              <td>${r.averageRating}</td>
              <td>${r.totalPatients}</td>
              <td>${r.completedAppointments}</td>
              <td>${r.licenseNumber || ''}</td>
              <td>
                <button class='btn btn-sm btn-info' onclick="editDoctor(${r.doctorId})">编辑</button>
                <button class='btn btn-sm btn-danger' onclick="deleteDoctor(${r.doctorId})">删除</button>
              </td>
            </tr>
          `;
              });
            })
            .catch(err => {
              console.error('查询家庭医生失败:', err);
              alert('查询失败：' + err.message);
            });
  }

  function showAddDoctorForm() {
    document.getElementById('formTitle').innerText = '新增家庭医生';
    document.getElementById('doctorForm').style.display = '';
    document.getElementById('doctorId').value = '';
    document.getElementById('userId').value = '';
    document.getElementById('specialty').value = '';
    document.getElementById('isAvailable').checked = false;
    document.getElementById('averageRating').value = '';
    document.getElementById('totalPatients').value = '';
    document.getElementById('completedAppointments').value = '';
    document.getElementById('licenseNumber').value = '';
  }

  function hideForm() {
    document.getElementById('doctorForm').style.display = 'none';
  }

  function submitForm(e) {
    e.preventDefault();
    const doctor = {
      doctorId: document.getElementById('doctorId').value,
      userId: document.getElementById('userId').value,
      specialty: document.getElementById('specialty').value,
      isAvailable: document.getElementById('isAvailable').checked ? 1 : 0,
      averageRating: document.getElementById('averageRating').value,
      totalPatients: document.getElementById('totalPatients').value,
      completedAppointments: document.getElementById('completedAppointments').value,
      licenseNumber: document.getElementById('licenseNumber').value
    };
    const url = doctor.doctorId ? apiBase + '/edit' : apiBase + '/add';
    const formData = new URLSearchParams();
    for (const key in doctor) {
      if (doctor[key] !== undefined && doctor[key] !== null) {
        formData.append(key, doctor[key]);
      }
    }
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData.toString()
    })
            .then(res => {
              if (!res.ok) {
                throw new Error('HTTP error! status: ' + res.status);
              }
              return res.json();
            })
            .then(data => {
              console.log('提交结果:', data);
              if (data.code === 1) {
                alert('操作成功');
                hideForm();
                fetchDoctors();
              } else {
                alert('操作失败：' + (data.msg || '未知错误'));
              }
            })
            .catch(err => {
              console.error('操作失败:', err);
              alert('操作失败：' + err.message);
            });
  }

  function editDoctor(id) {
    fetch(apiBase + '/queryById/' + id)
      .then(res => {
        if (!res.ok) {
          throw new Error('HTTP error! status: ' + res.status);
        }
        return res.json();
      })
      .then(data => {
        console.log('编辑医生数据:', data);
        // 先清空表单
        document.getElementById('doctorId').value = '';
        document.getElementById('userId').value = '';
        document.getElementById('specialty').value = '';
        document.getElementById('isAvailable').checked = false;
        document.getElementById('averageRating').value = '';
        document.getElementById('totalPatients').value = '';
        document.getElementById('completedAppointments').value = '';
        document.getElementById('licenseNumber').value = '';
        const r = (data.code === 1 && data.content) ? data.content : (data.data || data.content);
        if (data.code === 1 && r) {
          document.getElementById('formTitle').innerText = '编辑家庭医生';
          document.getElementById('doctorForm').style.display = '';
          if (document.getElementById('doctorId')) document.getElementById('doctorId').value = r.doctorId || r.doctor_id || '';
          if (document.getElementById('userId')) document.getElementById('userId').value = r.userId || r.user_id || '';
          if (document.getElementById('specialty')) document.getElementById('specialty').value = r.specialty || '';
          if (document.getElementById('isAvailable')) document.getElementById('isAvailable').checked = r.isAvailable !== undefined ? r.isAvailable : r.is_available ? true : false;
          if (document.getElementById('averageRating')) document.getElementById('averageRating').value = r.averageRating || r.average_rating || '';
          if (document.getElementById('totalPatients')) document.getElementById('totalPatients').value = r.totalPatients || r.total_patients || '';
          if (document.getElementById('completedAppointments')) document.getElementById('completedAppointments').value = r.completedAppointments || r.completed_appointments || '';
          if (document.getElementById('licenseNumber')) document.getElementById('licenseNumber').value = r.licenseNumber || r.license_number || '';
        } else {
          alert(data.msg || '获取数据失败');
        }
      })
      .catch(err => {
        console.error('获取医生详情失败:', err);
        alert('请求失败：' + err.message);
      });
  }

  function deleteDoctor(id) {
    if (!confirm('确定要删除该医生吗？')) return;
    fetch(apiBase + '/deleteById/' + id, { method: 'POST' })
            .then(res => {
              if (!res.ok) {
                throw new Error('HTTP error! status: ' + res.status);
              }
              return res.json();
            })
            .then(data => {
              console.log('删除结果:', data);
              if (data.code === 1) {
                alert('删除成功');
                fetchDoctors();
              } else {
                alert('删除失败：' + (data.msg || '未知错误'));
              }
            })
            .catch(err => {
              console.error('删除失败:', err);
              alert('删除失败：' + err.message);
            });
  }

  // 查询按钮事件
  function searchDoctors(e) {
    if (e) e.preventDefault();
    const params = {
      doctorId: document.getElementById('searchDoctorId').value.trim(),
      userId: document.getElementById('searchUserId').value.trim(),
      specialty: document.getElementById('searchSpecialty').value.trim(),
      isAvailable: document.getElementById('searchIsAvailable').value,
      averageRating: document.getElementById('searchAverageRating').value.trim(),
      totalPatients: document.getElementById('searchTotalPatients').value.trim(),
      completedAppointments: document.getElementById('searchCompletedAppointments').value.trim(),
      licenseNumber: document.getElementById('searchLicenseNumber').value.trim()
    };
    fetchDoctors(params);
  }

  // 重置查询
  function resetSearch() {
    document.getElementById('searchDoctorId').value = '';
    document.getElementById('searchUserId').value = '';
    document.getElementById('searchSpecialty').value = '';
    document.getElementById('searchIsAvailable').value = '';
    document.getElementById('searchAverageRating').value = '';
    document.getElementById('searchTotalPatients').value = '';
    document.getElementById('searchCompletedAppointments').value = '';
    document.getElementById('searchLicenseNumber').value = '';
    fetchDoctors();
  }

  // 页面加载时自动拉取家庭医生
  fetchDoctors();
</script>
</body>
</html>
