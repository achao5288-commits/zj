<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>居家健康监测 - 健康管理系统</title>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #2c7a7b;
      --success-color: #38a169;
      --warning-color: #d69e2e;
      --danger-color: #e53e3e;
    }
    body {
      background: linear-gradient(135deg, #f8f9fc 0%, #e6f2f2 100%);
      min-height: 100vh;
    }
    .navbar { background: var(--primary-color); }
    .content-container {
      padding: 2rem;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(44, 122, 123, 0.1);
      margin-top: 2rem;
    }
    .stats-card {
      background: linear-gradient(135deg, #ffffff 0%, #f0f8f8 100%);
      border-radius: 15px;
      padding: 1.5rem;
      box-shadow: 0 8px 20px rgba(44, 122, 123, 0.08);
      border: 1px solid rgba(44, 122, 123, 0.1);
      margin-bottom: 1rem;
    }
    .stats-number { font-size: 2rem; font-weight: 700; color: var(--primary-color); }
    .btn-primary {
      background: var(--primary-color);
      border: none;
      border-radius: 12px;
    }
    .badge-online { background-color: var(--success-color); color: white; padding: 0.4rem 0.8rem; border-radius: 8px; }
    .badge-offline { background-color: #999; color: white; padding: 0.4rem 0.8rem; border-radius: 8px; }
    .badge-warning { background-color: var(--warning-color); color: white; padding: 0.4rem 0.8rem; border-radius: 8px; }
    .badge-danger { background-color: var(--danger-color); color: white; padding: 0.4rem 0.8rem; border-radius: 8px; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="bi bi-building me-2"></i>社区档案管理平台</a>
    <div class="d-flex align-items-center">
      <div class="user-info text-white me-3" id="userInfo">未登录</div>
      <button class="btn btn-outline-light" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>退出登录</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="content-container">
    <h2 class="mb-4"><i class="bi bi-activity me-2"></i>居家健康监测</h2>
    
    <!-- 统计卡片 -->
    <div class="row g-4 mb-4">
      <div class="col-md-3">
        <div class="stats-card">
          <div class="stats-number" id="deviceCount">0</div>
          <div>已绑定设备</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card">
          <div class="stats-number" id="todayCheckin">--</div>
          <div>今日打卡</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card">
          <div class="stats-number" id="alertCount">0</div>
          <div>未读预警</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card">
          <div class="stats-number" id="monitorCount">0</div>
          <div>监测数据</div>
        </div>
      </div>
    </div>

    <!-- Tab导航 -->
    <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#devices">设备管理</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#monitoring">监测数据</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#checkin">健康打卡</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#checkinRecords">打卡记录</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#alerts">预警通知</button></li>
    </ul>

    <!-- Tab内容 -->
    <div class="tab-content">
      <!-- 设备管理 -->
      <div class="tab-pane fade show active" id="devices">
        <button class="btn btn-primary mb-3" onclick="showAddDeviceForm()"><i class="bi bi-plus-circle me-2"></i>添加设备</button>
        <table class="table table-hover">
          <thead><tr><th>设备名称</th><th>类型</th><th>品牌</th><th>连接方式</th><th>状态</th><th>最后同步</th><th>操作</th></tr></thead>
          <tbody id="deviceTable"></tbody>
        </table>
      </div>

      <!-- 添加设备模态框 -->
      <div class="modal fade" id="addDeviceModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">添加健康设备</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <form id="addDeviceForm">
                <div class="mb-3">
                  <label class="form-label">设备SDK码</label>
                  <input type="text" class="form-control" id="deviceSdkCode" placeholder="请输入设备SDK码 (例如: MI-BAND-SDK-2024)" required>
                  <div class="form-text">小米手环SDK码格式: MI-BAND-SDK-XXXX</div>
                </div>
                <div class="mb-3">
                  <label class="form-label">设备名称</label>
                  <input type="text" class="form-control" id="deviceName" placeholder="例如: 我的小米手环" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">设备类型</label>
                  <select class="form-control" id="deviceType" required>
                    <option value="智能手环">智能手环</option>
                    <option value="血压计">血压计</option>
                    <option value="血糖仪">血糖仪</option>
                    <option value="体脂秤">体脂秤</option>
                    <option value="其他">其他</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">连接方式</label>
                  <select class="form-control" id="connectionType" required>
                    <option value="Bluetooth">蓝牙(Bluetooth)</option>
                    <option value="WiFi">WiFi</option>
                    <option value="USB">USB</option>
                  </select>
                </div>
                <div id="devicePreview" class="alert alert-info" style="display:none;">
                  <strong>设备预览:</strong>
                  <div id="previewContent"></div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
              <button type="button" class="btn btn-primary" onclick="validateAndAddDevice()">验证并添加</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 监测数据 -->
      <div class="tab-pane fade" id="monitoring">
        <div class="row">
          <div class="col-md-6"><canvas id="heartRateChart"></canvas></div>
          <div class="col-md-6"><canvas id="bloodPressureChart"></canvas></div>
        </div>
        <table class="table table-hover mt-4">
          <thead><tr><th>数据类型</th><th>数值</th><th>测量时间</th><th>状态</th></tr></thead>
          <tbody id="monitoringTable"></tbody>
        </table>
      </div>

      <!-- 健康打卡 -->
      <div class="tab-pane fade" id="checkin">
        <div class="row">
          <div class="col-md-6">
            <h5 class="mb-3"><i class="bi bi-pencil-square me-2"></i>今日打卡</h5>
            <form id="checkinForm" class="row g-3">
              <div class="col-md-12">
                <label class="form-label">整体感受</label>
                <select class="form-control" name="overallFeeling">
                  <option value="良好">良好</option><option value="一般">一般</option><option value="不适">不适</option>
                </select>
              </div>
              <div class="col-md-12">
                <label class="form-label">睡眠质量</label>
                <select class="form-control" name="sleepQuality">
                  <option value="优秀">优秀</option><option value="良好">良好</option><option value="一般">一般</option><option value="差">差</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">睡眠时长(小时)</label>
                <input type="number" class="form-control" name="sleepHours" step="0.5">
              </div>
              <div class="col-md-6">
                <label class="form-label">运动状态</label>
                <select class="form-control" name="exerciseStatus">
                  <option value="无运动">无运动</option><option value="轻度">轻度</option><option value="中度">中度</option><option value="重度">重度</option>
                </select>
              </div>
              <div class="col-md-12">
                <label class="form-label">运动时长(分钟)</label>
                <input type="number" class="form-control" name="exerciseMinutes">
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-circle me-2"></i>提交打卡</button>
              </div>
            </form>
          </div>
          <div class="col-md-6">
            <h5 class="mb-3"><i class="bi bi-calendar-check me-2"></i>今日打卡状态</h5>
            <div class="alert alert-info">
              <h4>今日打卡：<span id="todayCheckin">加载中...</span></h4>
              <p class="mb-0 text-muted">每天只能打卡一次</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 打卡记录 -->
      <div class="tab-pane fade" id="checkinRecords">
        <h5 class="mb-3"><i class="bi bi-clock-history me-2"></i>打卡历史记录</h5>
        <table class="table table-hover">
          <thead><tr><th>日期</th><th>整体感受</th><th>睡眠质量</th><th>睡眠时长</th><th>运动状态</th><th>运动时长</th><th>打卡时间</th></tr></thead>
          <tbody id="checkinHistoryTable"></tbody>
        </table>
      </div>

      <!-- 预警通知 -->
      <div class="tab-pane fade" id="alerts">
        <div id="alertList"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
$(document).ready(function() {
  loadUserInfo();
  loadDevices();
  loadMonitoringData();
  loadAlerts();
  checkTodayCheckin();
  loadCheckinHistory();
});

function loadUserInfo() {
  var user = JSON.parse(localStorage.getItem('userInfo') || '{}');
  $('#userInfo').html(user.username ? `<i class="bi bi-person-circle me-2"></i>欢迎，${user.username}` : '未登录');
}

function loadDevices() {
  $.get('/spbYq/healthDevice/queryByPage', {page: 1, size: 100}, function(res) {
    if (res.code === 1) {
      var devices = res.data.content || res.data;
      $('#deviceCount').text(devices.length);
      var html = '';
      devices.forEach(function(d) {
        html += `<tr>
          <td>${d.deviceName}</td>
          <td>${d.deviceType}</td>
          <td>${d.deviceBrand}</td>
          <td>${d.connectionType}</td>
          <td><span class="${d.status === 'online' ? 'badge-online' : 'badge-offline'}">${d.status === 'online' ? '在线' : '离线'}</span></td>
          <td>${d.lastSyncTime || '--'}</td>
        </tr>`;
      });
      $('#deviceTable').html(html || '<tr><td colspan="6" class="text-center">暂无设备</td></tr>');
    }
  });
}

function loadMonitoringData() {
  $.get('/spbYq/healthMonitoring/queryByPage', {page: 1, size: 20}, function(res) {
    console.log('监测数据响应:', res);
    if (res.code === 1) {
      // 安全地获取数据
      var data = [];
      if (res.data) {
        if (res.data.content) {
          data = res.data.content;
        } else if (Array.isArray(res.data)) {
          data = res.data;
        }
      }
      
      $('#monitorCount').text(data.length);
      var html = '';
      data.forEach(function(d) {
        var status = d.isAbnormal === 1 ? '<span class="badge-danger">异常</span>' : '<span class="badge-online">正常</span>';
        html += `<tr><td>${d.dataType}</td><td>${d.dataValue} ${d.dataUnit || ''}</td><td>${d.measurementTime}</td><td>${status}</td></tr>`;
      });
      $('#monitoringTable').html(html || '<tr><td colspan="4" class="text-center">暂无数据</td></tr>');
    } else {
      $('#monitoringTable').html('<tr><td colspan="4" class="text-center">暂无数据</td></tr>');
      $('#monitorCount').text('0');
    }
  }).fail(function() {
    $('#monitoringTable').html('<tr><td colspan="4" class="text-center">加载失败</td></tr>');
  });
}

function loadAlerts() {
  $.get('/spbYq/healthAlert/unread/count', function(res) {
    console.log('未读预警数量:', res);
    if (res.code === 1) {
      $('#alertCount').text(res.data || res.content || 0);
    }
  }).fail(function() {
    $('#alertCount').text('0');
  });
  
  $.get('/spbYq/healthAlert/queryByPage', {page: 1, size: 10}, function(res) {
    console.log('预警列表响应:', res);
    if (res.code === 1) {
      // 安全地获取预警数据
      var alerts = [];
      if (res.data) {
        if (res.data.content) {
          alerts = res.data.content;
        } else if (Array.isArray(res.data)) {
          alerts = res.data;
        }
      }
      
      var html = '';
      alerts.forEach(function(a) {
        var levelClass = a.alertLevel === 'critical' ? 'badge-danger' : (a.alertLevel === 'warning' ? 'badge-warning' : 'badge-online');
        html += `<div class="alert ${a.isRead === 1 ? 'alert-light' : 'alert-warning'} mb-2">
          <strong><span class="${levelClass}">${a.alertLevel}</span> ${a.alertTitle}</strong>
          <p class="mb-1">${a.alertContent}</p>
          <small class="text-muted">${a.createTime}</small>
        </div>`;
      });
      $('#alertList').html(html || '<p class="text-center">暂无预警</p>');
    } else {
      $('#alertList').html('<p class="text-center">暂无预警</p>');
    }
  }).fail(function() {
    $('#alertList').html('<p class="text-center">加载失败</p>');
  });
}

function checkTodayCheckin() {
  $.get('/spbYq/healthCheckin/today', function(res) {
    console.log('今日打卡状态:', res);
    if (res.code === 1) {
      $('#todayCheckin').html('<span class="badge-online">已打卡</span>');
    } else {
      $('#todayCheckin').html('<span class="badge-warning">未打卡</span>');
    }
  }).fail(function() {
    $('#todayCheckin').html('<span class="badge-warning">未打卡</span>');
  });
}

function loadCheckinHistory() {
  $.get('/spbYq/healthCheckin/queryByPage', {page: 1, size: 30}, function(res) {
    console.log('打卡记录响应:', res);
    if (res.code === 1) {
      var records = [];
      if (res.content) {
        if (res.content.content && Array.isArray(res.content.content)) {
          records = res.content.content;
        } else if (Array.isArray(res.content)) {
          records = res.content;
        }
      } else if (res.data) {
        if (res.data.content && Array.isArray(res.data.content)) {
          records = res.data.content;
        } else if (Array.isArray(res.data)) {
          records = res.data;
        }
      }
      
      var html = '';
      records.forEach(function(r) {
        html += `<tr>
          <td>${r.checkinDate}</td>
          <td>${r.overallFeeling || '-'}</td>
          <td>${r.sleepQuality || '-'}</td>
          <td>${r.sleepHours ? r.sleepHours + '小时' : '-'}</td>
          <td>${r.exerciseStatus || '-'}</td>
          <td>${r.exerciseMinutes ? r.exerciseMinutes + '分钟' : '-'}</td>
          <td>${r.checkinTime || '-'}</td>
        </tr>`;
      });
      $('#checkinHistoryTable').html(html || '<tr><td colspan="7" class="text-center">暂无打卡记录</td></tr>');
    } else {
      $('#checkinHistoryTable').html('<tr><td colspan="7" class="text-center">暂无打卡记录</td></tr>');
    }
  }).fail(function() {
    $('#checkinHistoryTable').html('<tr><td colspan="7" class="text-center">加载失败</td></tr>');
  });
}

$(document).ready(function() {
  loadCheckinHistory();
});

$('#checkinForm').submit(function(e) {
  e.preventDefault();
  var formData = $(this).serialize();
  $.post('/spbYq/healthCheckin/add', formData, function(res) {
    if (res.code === 1) {
      alert('✅ 打卡成功！');
      // 更新打卡状态
      checkTodayCheckin();
      // 刷新打卡记录列表
      loadCheckinHistory();
      // 清空表单
      document.getElementById('checkinForm').reset();
      // 切换到打卡记录标签
      var checkinTab = document.querySelector('#myTab button[data-bs-target="#checkinRecords"]');
      if (checkinTab) {
        var tab = new bootstrap.Tab(checkinTab);
        tab.show();
      }
    } else {
      alert('❌ ' + (res.msg || '打卡失败'));
    }
  }).fail(function() {
    alert('❌ 打卡失败，请检查网络连接');
  });
});

function showAddDeviceForm() {
  // 显示添加设备模态框
  var modal = new bootstrap.Modal(document.getElementById('addDeviceModal'));
  modal.show();
  
  // 重置表单
  document.getElementById('addDeviceForm').reset();
  document.getElementById('devicePreview').style.display = 'none';
}

// SDK码验证和设备添加
function validateAndAddDevice() {
  var sdkCode = document.getElementById('deviceSdkCode').value.trim();
  var deviceName = document.getElementById('deviceName').value.trim();
  var deviceType = document.getElementById('deviceType').value;
  var connectionType = document.getElementById('connectionType').value;
  
  console.log('开始验证设备:', {sdkCode, deviceName, deviceType, connectionType});
  
  // 验证SDK码格式
  if (!sdkCode) {
    alert('请输入SDK码');
    return;
  }
  
  if (!deviceName) {
    alert('请输入设备名称');
    return;
  }
  
  // 模拟SDK验证
  var isValid = validateSdkCode(sdkCode);
  console.log('SDK验证结果:', isValid);
  
  if (!isValid) {
    alert('SDK码格式不正确或无效。\n\n支持的格式：\n- 小米手环: MI-BAND-SDK-XXXX\n- 欧姆龙血压计: OMRON-BP-SDK-XXXX\n- 罗氏血糖仪: ROCHE-GLU-SDK-XXXX\n- 华为体脂秤: HUAWEI-SCALE-SDK-XXXX');
    return;
  }
  
  // 显示设备预览
  showDevicePreview(sdkCode, deviceName, deviceType, connectionType);
  
  // 添加加载提示
  var preview = document.getElementById('devicePreview');
  preview.innerHTML += '<div class="mt-2"><div class="spinner-border spinner-border-sm text-primary me-2"></div>正在添加设备...</div>';
  
  console.log('开始调用后端API...');
  
  // 调用后端API添加设备
  addDeviceToServer(sdkCode, deviceName, deviceType, connectionType);
}

// 关闭模态框并清理焦点
function closeDeviceModal() {
  var modalEl = document.getElementById('addDeviceModal');
  var modal = bootstrap.Modal.getInstance(modalEl);
  if (modal) {
    // 先移除焦点
    if (document.activeElement) {
      document.activeElement.blur();
    }
    modal.hide();
  }
}

// 验证SDK码 (模拟)
function validateSdkCode(sdkCode) {
  // 小米手环SDK码格式: MI-BAND-SDK-XXXX
  var xiaomiPattern = /^MI-BAND-SDK-\d{4}$/i;
  
  // 其他设备SDK码格式
  var otherPatterns = [
    /^OMRON-BP-SDK-\d{4}$/i,  // 欧姆龙血压计
    /^ROCHE-GLU-SDK-\d{4}$/i,  // 罗氏血糖仪
    /^HUAWEI-SCALE-SDK-\d{4}$/i  // 华为体脂秤
  ];
  
  return xiaomiPattern.test(sdkCode) || otherPatterns.some(pattern => pattern.test(sdkCode));
}

// 显示设备预览
function showDevicePreview(sdkCode, deviceName, deviceType, connectionType) {
  var preview = document.getElementById('devicePreview');
  var content = document.getElementById('previewContent');
  
  var deviceInfo = parseSdkCode(sdkCode);
  
  content.innerHTML = `
    <p><strong>设备名称:</strong> ${deviceName}</p>
    <p><strong>设备类型:</strong> ${deviceType}</p>
    <p><strong>品牌:</strong> ${deviceInfo.brand}</p>
    <p><strong>型号:</strong> ${deviceInfo.model}</p>
    <p><strong>连接方式:</strong> ${connectionType}</p>
    <p><strong>设备SN:</strong> ${deviceInfo.sn}</p>
  `;
  
  preview.style.display = 'block';
}

// 解析SDK码获取设备信息
function parseSdkCode(sdkCode) {
  var info = {
    brand: '未知',
    model: '未知',
    sn: sdkCode
  };
  
  if (/^MI-BAND-SDK-/i.test(sdkCode)) {
    info.brand = '小米';
    info.model = 'MI-BAND-' + sdkCode.slice(-4);
  } else if (/^OMRON-BP-SDK-/i.test(sdkCode)) {
    info.brand = '欧姆龙';
    info.model = 'HEM-' + sdkCode.slice(-4);
  } else if (/^ROCHE-GLU-SDK-/i.test(sdkCode)) {
    info.brand = '罗氏';
    info.model = 'Accu-Chek-' + sdkCode.slice(-4);
  } else if (/^HUAWEI-SCALE-SDK-/i.test(sdkCode)) {
    info.brand = '华为';
    info.model = 'AH-' + sdkCode.slice(-4);
  }
  
  return info;
}

// 调用后端API添加设备
function addDeviceToServer(sdkCode, deviceName, deviceType, connectionType) {
  // 使用普通对象作为数据
  var data = {
    sdkCode: sdkCode,
    deviceName: deviceName
  };
  
  console.log('发送请求到:', '/spbYq/deviceSdk/addBySdk');
  console.log('请求数据:', data);
  
  $.ajax({
    url: '/spbYq/deviceSdk/addBySdk',
    type: 'POST',
    data: data,
    success: function(res) {
      console.log('收到响应:', res);
      if (res.code === 1) {
        alert('✅ 设备添加成功！\n\n设备已自动同步健康数据，请在"监测数据"标签页查看。');
        // 关闭模态框（使用新函数避免aria-hidden警告）
        closeDeviceModal();
        // 刷新设备列表和监测数据
        loadDevices();
        loadMonitoringData();
      } else {
        alert('❌ 添加失败: ' + (res.msg || '未知错误'));
        // 移除加载提示
        var preview = document.getElementById('devicePreview');
        preview.innerHTML = preview.innerHTML.replace('<div class="mt-2"><div class="spinner-border spinner-border-sm text-primary me-2"></div>正在添加设备...</div>', '');
      }
    },
    error: function(xhr, status, error) {
      console.error('请求失败:', {xhr: xhr.responseText, status: status, error: error});
      alert('❌ 网络错误，请稍后重试。\n\n错误信息: ' + error + '\n\n请检查：\n1. 后端服务是否启动\n2. 是否已登录\n3. SDK码是否正确');
      // 移除加载提示
      var preview = document.getElementById('devicePreview');
      preview.innerHTML = preview.innerHTML.replace('<div class="mt-2"><div class="spinner-border spinner-border-sm text-primary me-2"></div>正在添加设备...</div>', '');
    }
  });
}

// 加载设备列表
function loadDevices() {
  $.get('/spbYq/healthDevice/queryByPage', {page: 1, size: 100}, function(res) {
    console.log('设备列表响应:', res);
    if (res.code === 1) {
      // 安全地获取设备数据
      var devices = [];
      
      // 尝试多种数据结构
      if (res.content) {
        // 结构1: {content: {content: [...]}}
        if (res.content.content && Array.isArray(res.content.content)) {
          devices = res.content.content;
        }
        // 结构2: {content: [...]}
        else if (Array.isArray(res.content)) {
          devices = res.content;
        }
      }
      else if (res.data) {
        // 结构3: {data: {content: [...]}}
        if (res.data.content && Array.isArray(res.data.content)) {
          devices = res.data.content;
        }
        // 结构4: {data: [...]}
        else if (Array.isArray(res.data)) {
          devices = res.data;
        }
      }
      
      console.log('解析后的设备列表:', devices);
      $('#deviceCount').text(devices.length);
      
      var html = '';
      devices.forEach(function(d) {
        html += `<tr>
          <td>${d.deviceName || ''}</td>
          <td>${d.deviceType || ''}</td>
          <td>${d.deviceBrand || ''}</td>
          <td>${d.connectionType || ''}</td>
          <td><span class="${d.status === 'online' ? 'badge-online' : 'badge-offline'}">${d.status === 'online' ? '在线' : '离线'}</span></td>
          <td>${d.lastSyncTime || '--'}</td>
          <td>
            <button class="btn btn-sm btn-info me-1" onclick="syncDeviceData(${d.deviceId})"><i class="bi bi-arrow-clockwise"></i> 同步</button>
            <button class="btn btn-sm btn-danger" onclick="deleteDevice(${d.deviceId})">删除</button>
          </td>
        </tr>`;
      });
      
      console.log('设备HTML:', html);
      $('#deviceTable').html(html || '<tr><td colspan="7" class="text-center">暂无设备</td></tr>');
    } else {
      console.log('设备列表加载失败:', res.msg);
      $('#deviceTable').html('<tr><td colspan="7" class="text-center">暂无设备</td></tr>');
      $('#deviceCount').text('0');
    }
  }).fail(function(xhr, status, error) {
    console.error('设备列表请求失败:', {xhr: xhr.responseText, status: status, error: error});
    $('#deviceTable').html('<tr><td colspan="7" class="text-center">加载失败</td></tr>');
  });
}

// 删除设备
function deleteDevice(deviceId) {
  if (confirm('确定要删除该设备吗？')) {
    $.post('/spbYq/healthDevice/deleteById/' + deviceId, function(res) {
      if (res.code === 1) {
        alert('删除成功');
        loadDevices();
      } else {
        alert('删除失败: ' + (res.msg || '未知错误'));
      }
    });
  }
}

// 同步设备数据
function syncDeviceData(deviceId) {
  $.ajax({
    url: '/spbYq/deviceSdk/sync/' + deviceId,
    type: 'POST',
    success: function(res) {
      if (res.code === 1) {
        alert('同步成功！获取 ' + res.content + ' 条健康数据');
        // 刷新设备列表和监测数据
        loadDevices();
        loadMonitoringData();
      } else {
        alert('同步失败: ' + (res.msg || '未知错误'));
      }
    },
    error: function() {
      alert('网络错误，请稍后重试');
    }
  });
}

function logout() {
  localStorage.removeItem('userInfo');
  window.location.href = 'login.html';
}
</script>
