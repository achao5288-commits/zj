<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 社区档案管理平台</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c7a7b;
            --secondary-color: #718096;
            --success-color: #38a169;
            --info-color: #319795;
            --warning-color: #d69e2e;
            --danger-color: #e53e3e;
        }

        body {
            background: linear-gradient(135deg, #f8f9fc 0%, #e6f2f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 40px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(44, 122, 123, 0.1);
            border: 1px solid rgba(44, 122, 123, 0.1);
        }

        .login-title {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary-color);
            font-size: 28px;
            font-weight: 700;
            position: relative;
            padding-bottom: 15px;
        }

        .login-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--primary-color);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(44, 122, 123, 0.2);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(44, 122, 123, 0.25);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: var(--primary-color);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.4s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(44, 122, 123, 0.4);
            background: var(--info-color);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: var(--secondary-color);
        }

        .register-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .register-link a:hover {
            color: var(--info-color);
        }

        .alert {
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid transparent;
        }

        .alert-danger {
            background: rgba(229, 62, 62, 0.1);
            border-color: rgba(229, 62, 62, 0.2);
            color: var(--danger-color);
        }

        .invalid-feedback {
            color: var(--danger-color);
            font-size: 0.875rem;
            margin-top: 5px;
        }

        .platform-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: block;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="login-container">
        <i class="bi bi-building platform-icon"></i>
        <h2 class="login-title">用户登录</h2>
        <div class="alert alert-danger" role="alert" id="loginError" style="display: none;"></div>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username" required>
                <div class="invalid-feedback">请输入用户名</div>
            </div>
            <div class="form-group">
                <label for="phoneNumber" class="form-label">手机号码</label>
                <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber"
                       pattern="^1[3-9]\d{9}$" required>
                <div class="invalid-feedback">请输入有效的手机号码</div>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="passwordHash" required>
                <div class="invalid-feedback">请输入密码</div>
            </div>
            <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>登录
            </button>
        </form>
        <div class="register-link">
            还没有账号？<a href="register.html">立即注册</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    async function handleLogin(event) {
        event.preventDefault();
        const phoneNumber = document.getElementById('phoneNumber').value;
        const password = document.getElementById('password').value;
        const username = document.getElementById('username').value;
        const errorAlert = document.getElementById('loginError');

        // 手机号码格式验证
        if (!phoneNumber.match(/^1[3-9]\d{9}$/)) {
            errorAlert.textContent = '请输入有效的手机号码';
            errorAlert.style.display = 'block';
            return;
        }

        $.ajax({
            url:'http://localhost:8081/spbYq/users/login',
            type:'POST',
            xhrFields: {
                withCredentials: true  // 携带Cookie（Session ID）
            },
            data:{
                phoneNumber: phoneNumber,
                passwordHash: password,
                username: username
            },
            success: function (response){
                if(response && response.code === 1) {
                    localStorage.setItem('userInfo', JSON.stringify(response.content));
                    alert('登录成功');
                    window.location.href = '/spbYq/index.html';
                } else {
                    errorAlert.textContent = response.msg || '用户名或密码错误';
                    errorAlert.style.display = 'block';
                }
            },
            error:function (xhr,status,error){
                errorAlert.textContent = '登录失败:'+error;
                errorAlert.style.display = 'block';
            }
        })
    }
</script>

</body>
</html>
