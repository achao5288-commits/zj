<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康记录 - 健康管理系统</title>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #2c7a7b;
      --secondary-color: #718096;
      --success-color: #38a169;
      --info-color: #319795;
      --warning-color: #d69e2e;
      --danger-color: #e53e3e;
    }

    body {
      background: linear-gradient(135deg, #f8f9fc 0%, #e6f2f2 100%);
      min-height: 100vh;
    }

    .navbar {
      background: var(--primary-color);
      box-shadow: 0 4px 25px rgba(0,0,0,0.1);
    }

    .navbar-brand {
      color: #ffffff !important;
      font-weight: 700;
    }

    .content-container {
      padding: 2rem;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(44, 122, 123, 0.1);
      margin-top: 2rem;
      border: 1px solid rgba(44, 122, 123, 0.1);
    }

    .user-info {
      padding: 0.85rem 1.75rem;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      margin-right: 1.25rem;
      font-weight: 600;
      color: var(--primary-color);
      box-shadow: 0 4px 15px rgba(44, 122, 123, 0.1);
    }

    .btn-primary {
      background: var(--primary-color);
      border: none;
      color: white;
      box-shadow: 0 5px 15px rgba(44, 122, 123, 0.3);
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(44, 122, 123, 0.4);
      background: var(--info-color);
    }

    .btn-outline-primary {
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .btn-outline-primary:hover {
      background: var(--primary-color);
      border-color: transparent;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(44, 122, 123, 0.4);
      color: white;
    }

    .btn-success {
      background: var(--success-color);
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .btn-success:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(56, 161, 105, 0.4);
    }

    .table {
      border-radius: 10px;
      overflow: hidden;
    }

    .table thead th {
      background: rgba(44, 122, 123, 0.05);
      color: var(--primary-color);
      font-weight: 600;
      border-bottom: 2px solid rgba(44, 122, 123, 0.1);
    }

    .alert-info {
      background: rgba(44, 122, 123, 0.1);
      border: 1px solid rgba(44, 122, 123, 0.2);
      color: var(--primary-color);
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.2rem rgba(44, 122, 123, 0.25);
    }

    .btn-outline-light {
      color: #fff;
      border-color: #fff;
    }

    .btn-outline-light:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .form-label {
      color: var(--primary-color);
      font-weight: 600;
    }

    select.form-control {
      cursor: pointer;
    }

    .btn-sm {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
    }

    .btn-info {
      background: var(--info-color);
      border: none;
      color: white;
    }

    .btn-info:hover {
      background: var(--primary-color);
      color: white;
    }

    .btn-danger {
      background: var(--danger-color);
      border: none;
    }

    .btn-danger:hover {
      background: #c53030;
    }
  </style>
</head>

<body>
<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-building me-2"></i>社区档案管理平台
    </a>
    <div class="d-flex align-items-center">
      <div class="user-info" id="userInfo">
        未登录
      </div>
      <button class="btn btn-outline-light" onclick="logout()">
        <i class="bi bi-box-arrow-right me-2"></i>退出登录
      </button>
    </div>
  </div>
</nav>

<!-- 主要内容 -->
<div class="container">
  <div class="content-container">
    <h2 class="mb-4">健康记录</h2>
    <div class="alert alert-info">
      此模块用于记录和管理您的健康数据。
    </div>
    <!-- 健康记录功能区块开始 -->
    <div class="mb-3">
      <button class="btn btn-success" onclick="showAddForm()">新增健康记录</button>
    </div>
    <!-- 查询条件输入区 -->
    <form class="row g-2 mb-3" id="searchForm" onsubmit="searchRecords(event)">
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchUserId" placeholder="用户ID">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchRecordType" placeholder="类型">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchReportName" placeholder="报告名称">
      </div>
      <div class="col-md-2">
        <input type="date" class="form-control" id="searchReportDate" placeholder="报告日期">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="searchDoctorName" placeholder="医生">
      </div>
      <div class="col-md-1">
        <select class="form-control" id="searchIsAbnormal">
          <option value="">异常?</option>
          <option value="1">是</option>
          <option value="0">否</option>
        </select>
      </div>
      <div class="col-md-1">
        <button type="submit" class="btn btn-primary w-100">查询</button>
      </div>
      <div class="col-md-1">
        <button type="button" class="btn btn-secondary w-100" onclick="resetSearch()">重置</button>
      </div>
    </form>
    <table class="table table-bordered" id="recordsTable">
      <thead>
      <tr>
        <th>ID</th>
        <th>用户ID</th>
        <th>类型</th>
        <th>报告名称</th>
        <th>报告日期</th>
        <th>医生</th>
        <th>摘要</th>
        <th>异常</th>
        <th>操作</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
    <!-- 内嵌编辑/新增表单，仿照健康提醒页面 -->
    <div id="recordForm" style="display:none;max-width:500px;margin-top:30px;">
      <h5 id="formTitle">新增健康记录</h5>
      <form onsubmit="submitForm(event)">
        <input type="hidden" id="recordId">
        <div class="mb-2">
          <label>用户ID:</label>
          <input type="number" class="form-control" id="userId" required>
        </div>
        <div class="mb-2">
          <label>类型:</label>
          <select class="form-control" id="recordType" required>
            <option value="">请选择类型</option>
            <option value="体检">体检</option>
            <option value="门诊">门诊</option>
            <option value="住院">住院</option>
          </select>
        </div>
        <div class="mb-2">
          <label>报告名称:</label>
          <input type="text" class="form-control" id="reportName" placeholder="请输入报告名称（如：血常规、心电图等）" required>
        </div>
        <div class="mb-2">
          <label>报告日期:</label>
          <input type="date" class="form-control" id="reportDate" required>
        </div>
        <div class="mb-2">
          <label>医生:</label>
          <select class="form-control" id="doctorName">
            <option value="">请选择医生</option>
            <option value="张医生">张医生</option>
            <option value="李医生">李医生</option>
            <option value="王医生">王医生</option>
          </select>
        </div>
        <div class="mb-2">
          <label>摘要:</label>
          <input type="text" class="form-control" id="summary">
        </div>
        <div class="mb-2">
          <label>异常:</label>
          <input type="checkbox" id="isAbnormal">
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <button type="button" class="btn btn-secondary" onclick="hideForm()">取消</button>
      </form>
    </div>
    <!-- 健康记录功能区块结束 -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // 通用数据提取函数
  function extractList(data) {
    if (Array.isArray(data.data)) return data.data;
    if (data.data && Array.isArray(data.data.content)) return data.data.content;
    if (Array.isArray(data.content)) return data.content;
    if (data.content && Array.isArray(data.content.content)) return data.content.content;
    if (Array.isArray(data)) return data;
    return [];
  }

  // 权限控制，查询按钮始终可用
  function setButtonPermission() {
    const userInfoStr = localStorage.getItem('userInfo');
    if (!userInfoStr) return;
    const user = JSON.parse(userInfoStr);
    if (user.userType == 1) {
      // 只禁用用户ID输入框
      const userIdInput = document.getElementById('searchUserId');
      if (userIdInput) userIdInput.disabled = true;
      // 允许其他输入和查询按钮可用
      document.querySelectorAll('input,select,textarea,button[type=submit]').forEach(el => {
        if (el.id !== 'searchUserId') el.disabled = false;
      });
      // 只隐藏增删改按钮
      document.querySelectorAll('.btn-info,.btn-danger,.btn-success').forEach(btn => btn.style.display = 'none');
    }
  }

  window.onload = function() {
    setButtonPermission();
    fetchRecords();
    // 查询按钮事件绑定
    const searchBtn = document.querySelector('form#searchForm button[type=submit]');
    if (searchBtn) {
      searchBtn.addEventListener('click', searchRecords);
    }
  };

  // 健康记录功能JS
  const apiBase = '/spbYq/healthRecords';

  function fetchRecords(params = {}) {
    let url = apiBase + '/queryByPage?page=1&size=20';
    const searchParams = new URLSearchParams();
    for (const key in params) {
      if (params[key]) searchParams.append(key, params[key]);
    }
    if (searchParams.toString()) {
      url += '&' + searchParams.toString();
    }
    fetch(url, {
      credentials: 'include'  // 携带Cookie（Session ID）
    })
            .then(res => res.json())
            .then(data => {
              const list = extractList(data);
              const tbody = document.querySelector('#recordsTable tbody');
              tbody.innerHTML = '';
              if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center">暂无数据</td></tr>';
                return;
              }
              list.forEach((r, index) => {
                const id = r.recordId !== undefined ? r.recordId : r.record_id;
                tbody.innerHTML += `
            <tr>
              <td>${index + 1}</td>
              <td>${r.userId || r.user_id || ''}</td>
              <td>${r.recordType || r.record_type || ''}</td>
              <td>${r.reportName || r.report_name || ''}</td>
              <td>${(r.recordDate || r.record_date) ? (r.recordDate || r.record_date).substring(0, 10) : ''}</td>
              <td>${r.doctorName || r.doctor_name || ''}</td>
              <td>${r.summary || ''}</td>
              <td>${(r.isAbnormal !== undefined ? r.isAbnormal : r.is_abnormal) ? '是' : '否'}</td>
              <td>
                ${id !== undefined
                        ? `<button class='btn btn-sm btn-info' onclick="editRecord(${id})">编辑</button>\n<button class='btn btn-sm btn-danger' onclick="deleteRecord(${id})">删除</button>`
                        : `<button class='btn btn-sm btn-secondary' disabled>无ID</button>`
                }
              </td>
            </tr>
          `;
              });
            });
  }

  function showAddForm() {
    document.getElementById('formTitle').innerText = '新增健康记录';
    document.getElementById('recordForm').style.display = 'block';
    document.getElementById('recordId').value = '';
    document.getElementById('userId').value = '';
    document.getElementById('recordType').value = '';
    document.getElementById('reportName').value = '';
    document.getElementById('reportDate').value = '';
    document.getElementById('doctorName').value = '';
    document.getElementById('summary').value = '';
    document.getElementById('isAbnormal').checked = false;
  }

  function hideForm() {
    document.getElementById('recordForm').style.display = 'none';
  }

  function submitForm(e) {
    e.preventDefault();
    const record = {
      recordId: document.getElementById('recordId').value,
      userId: document.getElementById('userId').value,
      recordType: document.getElementById('recordType').value,
      reportName: document.getElementById('reportName').value,
      reportDate: document.getElementById('reportDate').value,
      doctorName: document.getElementById('doctorName').value,
      summary: document.getElementById('summary').value,
      isAbnormal: document.getElementById('isAbnormal').checked ? 1 : 0
    };
    const url = record.recordId ? apiBase + '/edit' : apiBase + '/add';
    const formData = new URLSearchParams();
    for (const key in record) {
      if (record[key] !== undefined && record[key] !== null) {
        formData.append(key, record[key]);
      }
    }
    fetch(url, {
      method: 'POST',
      credentials: 'include',  // 携带Cookie（Session ID）
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData.toString()
    })
            .then(res => res.json())
            .then(data => {
              if (data.code === 1) {
                alert('操作成功');
                hideForm();
                fetchRecords();
              } else {
                alert('操作失败');
              }
            });
  }

  function editRecord(id) {
    fetch(apiBase + '/queryById/' + id, {
      credentials: 'include'  // 携带Cookie
    })
      .then(res => res.json())
      .then(data => {
        // 先清空表单
        document.getElementById('recordId').value = '';
        document.getElementById('userId').value = '';
        document.getElementById('recordType').value = '';
        document.getElementById('reportName').value = '';
        document.getElementById('reportDate').value = '';
        document.getElementById('doctorName').value = '';
        document.getElementById('summary').value = '';
        document.getElementById('isAbnormal').checked = false;
        // 兼容data和content
        const r = data.data || data.content;
        if (data.code === 1 && r) {
          document.getElementById('formTitle').innerText = '编辑健康记录';
          document.getElementById('recordForm').style.display = 'block';
          if (document.getElementById('recordId')) document.getElementById('recordId').value = r.recordId || r.record_id || '';
          if (document.getElementById('userId')) document.getElementById('userId').value = r.userId || r.user_id || '';
          if (document.getElementById('recordType')) document.getElementById('recordType').value = r.recordType || r.record_type || '';
          if (document.getElementById('reportName')) document.getElementById('reportName').value = r.reportName || r.report_name || '';
          if (document.getElementById('reportDate')) document.getElementById('reportDate').value = (r.recordDate || r.record_date) ? (r.recordDate || r.record_date).substring(0,10) : '';
          if (document.getElementById('doctorName')) document.getElementById('doctorName').value = r.doctorName || r.doctor_name || '';
          if (document.getElementById('summary')) document.getElementById('summary').value = r.summary || '';
          if (document.getElementById('isAbnormal')) document.getElementById('isAbnormal').checked = (r.isAbnormal !== undefined ? r.isAbnormal : r.is_abnormal) ? true : false;
        } else {
          alert(data.msg || '获取数据失败');
        }
      })
      .catch(err => {
        alert('请求失败: ' + err);
      });
  }

  function deleteRecord(id) {
    if (!confirm('确定要删除该记录吗？')) return;
    fetch(apiBase + '/deleteById/' + id, { 
      method: 'POST',
      credentials: 'include'  // 携带Cookie
    })
            .then(res => res.json())
            .then(data => {
              if (data.code === 1) {
                alert('删除成功');
                fetchRecords();
              } else {
                alert('删除失败');
              }
            });
  }

  // 查询按钮事件
  function searchRecords(e) {
    if (e) e.preventDefault();
    const params = {
      userId: document.getElementById('searchUserId').value.trim(),
      recordType: document.getElementById('searchRecordType').value.trim(),
      reportName: document.getElementById('searchReportName').value.trim(),
      recordDate: document.getElementById('searchReportDate').value.trim(),
      doctorName: document.getElementById('searchDoctorName').value.trim(),
      isAbnormal: document.getElementById('searchIsAbnormal').value
    };
    fetchRecords(params);
  }

  // 重置查询
  function resetSearch() {
    document.getElementById('searchUserId').value = '';
    document.getElementById('searchRecordType').value = '';
    document.getElementById('searchReportName').value = '';
    document.getElementById('searchReportDate').value = '';
    document.getElementById('searchDoctorName').value = '';
    document.getElementById('searchIsAbnormal').value = '';
    fetchRecords();
  }

  // 退出登录
  function logout() {
    localStorage.removeItem('userInfo');
    window.location.href = 'login.html';
  }
</script>
</body>

</html>
